services:

  wamai-engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.wamai
    container_name: wamai-engine
    ports:
      - "${WAMAI_BIND_ADDRESS:-127.0.0.1}:8080:8080"
      - "127.0.0.1:9090:9090"
    environment:
      WAMAI_BIND_ADDRESS: "${WAMAI_BIND_ADDRESS:-127.0.0.1}"
      WAMAI_PANEL_ADDR: "0.0.0.0:9090"
    volumes:
      - ../logs:/root/logs
      - ../config:/root/config
      - /var/run/docker.sock:/var/run/docker.sock
    restart: on-failure
    depends_on:
      - boat-1
      - boat-2
      - boat-3
    networks:
      - defense-net

  boat-1:
    image: defensematrix-boat:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.boat
    container_name: boat-1
    networks:
      - defense-net
    restart: unless-stopped

  boat-2:
    image: defensematrix-boat:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.boat
    container_name: boat-2
    networks:
      - defense-net
    restart: unless-stopped

  boat-3:
    image: defensematrix-boat:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.boat
    container_name: boat-3
    networks:
      - defense-net
    restart: unless-stopped

networks:
  defense-net:
    name: defense-net
    driver: bridge